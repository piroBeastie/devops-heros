name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_DIR: session-17-devsecops/demo

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: ${{ env.APP_DIR }}
        run: python -m pytest -q

  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit

      # report only: the demo app has a real HIGH finding (debug=True + bind
      # 0.0.0.0), so a strict gate here would block the whole pipeline
      - name: Run bandit
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: bandit -r app/ -ll

  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pip-audit -r requirements.txt

  secret-scan:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks on the app folder
        # scoped to the app folder; a repo-wide scan reports the base64 secrets
        # that session 12 deliberately commits as teaching examples
        run: |
          docker run --rm -v "$PWD/${APP_DIR}":/scan zricethezav/gitleaks:latest \
            dir /scan --no-banner --redact -v

  image-scan:
    name: Container Image Scan - Trivy
    runs-on: ubuntu-latest
    needs: [ test, sca ]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        working-directory: ${{ env.APP_DIR }}
        run: docker build -t devsecops-demo:${{ github.sha }} .

      - name: Trivy report (all HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-demo:${{ github.sha }}
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln'
          exit-code: '0'

      - name: Security gate - fail on FIXABLE HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-demo:${{ github.sha }}
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln'
          ignore-unfixed: true
          exit-code: '1'

  deploy:
    name: Deploy (gated)
    runs-on: ubuntu-latest
    needs: [ image-scan, secret-scan ]
    steps:
      - name: Deploy step
        run: |
          echo "All required gates passed - safe to deploy"
          echo "image: devsecops-demo:${{ github.sha }}"
