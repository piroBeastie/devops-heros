# applied once by hand: kubectl apply -f argocd-apps/session20-app.yaml
# it points argo cd at the manifests in my own github repo
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/piroBeastie/devops-heros.git
    targetRevision: main
    path: session20-monitoring-observability-gitops/05-introduction-to-gitops/app

  destination:
    server: https://kubernetes.default.svc
    namespace: session20

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
