# mini project application - applied once by hand
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-mini
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/piroBeastie/devops-heros.git
    targetRevision: main
    path: session20-monitoring-observability-gitops/gitops-app

  destination:
    server: https://kubernetes.default.svc
    namespace: session20-mini

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
